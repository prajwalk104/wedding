<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prajwal & Dhanya - Wedding Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Playfair Display', serif;
    background: #0a0a0a;
    -webkit-tap-highlight-color: transparent;
  }

  .slider {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .slide.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    z-index: 2;
    animation: slideIn 0.6s ease-out;
  }
  .slide.leaving {
    opacity: 1;
    visibility: visible;
    z-index: 1;
    animation: slideOut 0.5s ease-in forwards;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: scale(1.03); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes slideOut {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(0.97); }
  }

  .slide img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  /* Invisible clickable hotspots over image location text */
  .hotspot {
    position: absolute;
    z-index: 5;
    cursor: pointer;
    display: block;
  }

  /* Reception slide - location area */
  .hs-reception-loc {
    top: 56%;
    left: 55%;
    width: 40%;
    height: 12%;
  }

  /* Muhurtham slide - location area */
  .hs-muhurtham-loc {
    top: 60%;
    left: 20%;
    width: 60%;
    height: 12%;
  }

  /* Thank You slide - "View Location" button area */
  .hs-thankyou-btn {
    top: 53%;
    left: 15%;
    width: 70%;
    height: 7%;
    border-radius: 30px;
  }

  /* Cover + overlay text for Muhurtham slide paragraph */
  .inviting-cover {
    position: absolute;
    z-index: 4;
    background: rgb(253, 233, 195);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .inviting-cover.ready { opacity: 1; }
  .inviting-text {
    position: absolute;
    z-index: 5;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    color: rgb(132, 76, 61);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .inviting-text.ready { opacity: 1; }

  /* Cover to hide the URL text in the image */
  .url-cover {
    position: absolute;
    z-index: 4;
    top: 57.3%;
    left: 18%;
    width: 64%;
    height: 3%;
    background: linear-gradient(180deg,
      rgb(93,2,10) 0%,
      rgb(93,2,10) 40%,
      rgb(180,120,50) 75%,
      rgb(245,197,99) 100%
    );
    border-radius: 0 0 8px 8px;
  }

  /* Thank You slide - venue address */
  .hs-thankyou-addr {
    top: 62%;
    left: 15%;
    width: 70%;
    height: 10%;
  }

  /* Navigation */
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(107,29,53,0.55);
    border: 1.5px solid rgba(255,255,255,0.35);
    color: #fff;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    user-select: none;
  }
  .nav-btn:active { transform: translateY(-50%) scale(0.92); }
  .nav-btn:hover { background: rgba(107,29,53,0.8); }
  .nav-btn.left { left: 10px; }
  .nav-btn.right { right: 10px; }
  .nav-btn.hide { opacity: 0; pointer-events: none; }

  /* Dots */
  .dots {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 10px;
    background: rgba(0,0,0,0.3);
    padding: 8px 16px;
    border-radius: 20px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .dot.on {
    background: #fff;
    transform: scale(1.25);
    box-shadow: 0 0 6px rgba(255,255,255,0.5);
  }

  /* Home */
  .home {
    position: absolute;
    top: 12px; left: 12px;
    z-index: 10;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(107,29,53,0.55);
    border: 1.5px solid rgba(255,255,255,0.35);
    color: #fff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: background 0.2s;
  }
  .home:hover { background: rgba(107,29,53,0.8); }

  /* Slide label */
  .tag {
    position: absolute;
    top: 12px; right: 12px;
    z-index: 6;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: rgba(107,29,53,0.55);
    padding: 5px 12px;
    border-radius: 16px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  /* Swipe hint */
  .hint {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: #fff;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: rgba(0,0,0,0.3);
    padding: 5px 14px;
    border-radius: 14px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    pointer-events: none;
    animation: hintPulse 2.5s ease-in-out infinite;
    transition: opacity 0.6s;
  }
  .hint.gone { opacity: 0; }
  @keyframes hintPulse {
    0%,100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="slider" id="slider">

  <!-- Slide 0: Family Details -->
  <div class="slide active" data-i="0">
    <img src="images/2.webp" alt="Family Blessings">
    <span class="tag">Family</span>
  </div>

  <!-- Slide 1: Reception -->
  <div class="slide" data-i="1">
    <img src="images/3.webp" alt="Reception">
    <span class="tag">Reception</span>
    <a class="hotspot hs-reception-loc" href="https://www.google.com/maps/search/P.G.M.+Srigandha+Palace+Bellari+Road+Hebbal+Bengaluru+560092" target="_blank" rel="noopener"></a>
  </div>

  <!-- Slide 2: Muhurtham -->
  <div class="slide" data-i="2">
    <img src="images/4.webp" alt="Muhurtham">
    <span class="tag">Muhurtham</span>
    <div class="inviting-cover" id="invitingCover"></div>
    <div class="inviting-text" id="invitingText"><span>To share the joy of our</span><span>wedding ceremony as we begin our</span><span>new journey together.</span></div>
    <a class="hotspot hs-muhurtham-loc" href="https://www.google.com/maps/search/P.G.M.+Srigandha+Palace+Bellari+Road+Hebbal+Bengaluru+560092" target="_blank" rel="noopener"></a>
  </div>

  <!-- Slide 3: Thank You -->
  <div class="slide" data-i="3">
    <img src="images/5.webp" alt="Thank You">
    <span class="tag">Thank You</span>
    <a class="hotspot hs-thankyou-btn" href="https://www.google.com/maps/search/P.G.M.+Srigandha+Palace+Bellari+Road+Hebbal+Bengaluru+560092" target="_blank" rel="noopener"></a>
    <div class="url-cover"></div>
    <a class="hotspot hs-thankyou-addr" href="https://www.google.com/maps/search/P.G.M.+Srigandha+Palace+Bellari+Road+Hebbal+Bengaluru+560092" target="_blank" rel="noopener"></a>
  </div>

  <!-- Controls -->
  <a class="home" href="index.html">&#8962;</a>
  <div class="nav-btn left hide" id="prev">&#10094;</div>
  <div class="nav-btn right" id="next">&#10095;</div>
  <div class="hint" id="hint">&#8592; Swipe to explore</div>
  <div class="dots" id="dots"></div>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  const dotsEl = document.getElementById('dots');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const hint = document.getElementById('hint');
  let cur = 0;
  let busy = false;

  // Build dots
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    d.onclick = () => go(i);
    dotsEl.appendChild(d);
  }

  function go(to) {
    if (busy || to === cur || to < 0 || to >= total) return;
    busy = true;

    const old = slides[cur];
    const nxt = slides[to];

    old.classList.remove('active');
    old.classList.add('leaving');
    nxt.classList.add('active');

    // Clean up after animations
    const cleanup = () => {
      old.classList.remove('leaving');
      busy = false;
    };
    nxt.addEventListener('animationend', cleanup, { once: true });
    // Safety fallback
    setTimeout(cleanup, 700);

    // Update dots
    dotsEl.children[cur].classList.remove('on');
    dotsEl.children[to].classList.add('on');

    // Update arrows
    prev.classList.toggle('hide', to === 0);
    next.classList.toggle('hide', to === total - 1);

    cur = to;

    if (!hint.classList.contains('gone')) hint.classList.add('gone');
  }

  prev.onclick = () => go(cur - 1);
  next.onclick = () => go(cur + 1);

  // Touch swipe
  let tx = 0, ty = 0;
  const sl = document.getElementById('slider');
  sl.addEventListener('touchstart', e => {
    tx = e.changedTouches[0].screenX;
    ty = e.changedTouches[0].screenY;
  }, { passive: true });
  sl.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].screenX - tx;
    const dy = e.changedTouches[0].screenY - ty;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      go(cur + (dx < 0 ? 1 : -1));
    }
  }, { passive: true });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') go(cur - 1);
    else if (e.key === 'ArrowRight') go(cur + 1);
    else if (e.key === 'Escape') location.href = 'index.html';
  });

  // Auto-hide hint
  setTimeout(() => hint.classList.add('gone'), 4000);

  // Position cover + overlay text on Muhurtham slide (all 3 lines)
  function positionInvitingCover() {
    const img = document.querySelector('.slide[data-i="2"] img');
    const cover = document.getElementById('invitingCover');
    const text = document.getElementById('invitingText');
    if (!img || !img.naturalWidth) return;
    const imgW = img.naturalWidth, imgH = img.naturalHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    const imgRatio = imgW / imgH, vpRatio = vw / vh;
    let scale, offsetX = 0;
    if (vpRatio > imgRatio) { scale = vw / imgW; }
    else { scale = vh / imgH; offsetX = (vw - imgW * scale) / 2; }
    const L = 0.255, R = 0.745, T = 0.328, B = 0.410;
    const left = L * imgW * scale + offsetX;
    const top = T * imgH * scale;
    const w = (R - L) * imgW * scale;
    const h = (B - T) * imgH * scale;
    cover.style.left = left + 'px';
    cover.style.top = top + 'px';
    cover.style.width = w + 'px';
    cover.style.height = h + 'px';
    cover.classList.add('ready');
    text.style.left = left + 'px';
    text.style.top = top + 'px';
    text.style.width = w + 'px';
    text.style.height = h + 'px';
    const lineH = h / 3;
    text.style.fontSize = (lineH * 0.62) + 'px';
    text.querySelectorAll('span').forEach(s => s.style.lineHeight = lineH + 'px');
    text.classList.add('ready');
  }
  const muhImg = document.querySelector('.slide[data-i="2"] img');
  if (muhImg.complete) positionInvitingCover();
  else muhImg.addEventListener('load', positionInvitingCover);
  window.addEventListener('resize', positionInvitingCover);
</script>
</body>
</html>
